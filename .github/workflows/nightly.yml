name: Nightly stress and fuzzing

# ---------------------------------------------------------------------------------------
# Work too slow for every change: the stress races at full size, the fuzz targets for an hour
# each, the property tests at a million cases, and the 32-bit ARM build under emulation.
#
# The races in tests/Cap.Stress.Tests at full size. The same tests run on every change at a
# size that finishes in seconds, which shows the harness still stages its races and still
# tells their outcomes apart; a race lost once in a million attempts is only found here.
#
# What fails the run is the same at both sizes: an attempt that reached outside the sandbox,
# an attempt that reached something the race cannot vouch for, anything outside changed, or a
# descriptor left open. The rest of what the races count -- above all how often a resolution
# was steered to a different object inside -- is the measurement, and is written to the job
# summary, where the figures quoted in docs/threat-model.md come from.
# ---------------------------------------------------------------------------------------

on:
  # Every night at the same time. Sunday's run is its own entry so that the fuzz job can tell
  # it apart and keep a copy of its corpus outside the cache (see below).
  schedule:
    - cron: "23 3 * * 1-6"
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      iterations:
        description: Attempts per race and backend
        default: "1000000"
      fuzz_seconds:
        description: Seconds per fuzz target
        default: "3600"

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  stress:
    name: stress (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux backends run on each Linux leg, one after the other in one process: the
          # suite substitutes the walk for the confined open itself, the same way the escape
          # corpus does, so no separate forced-fallback leg is needed.
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Cap.Stress.Tests/Cap.Stress.Tests.csproj --configuration Release

      # PowerShell rather than bash. On Windows bash is the MSYS2 runtime, which enables the
      # backup and restore privileges in an administrator's token, and the test process
      # inherits them -- which every test assembly refuses to run with.
      - name: Run the races at full size
        shell: pwsh
        env:
          CAPDOTNET_STRESS_ITERATIONS: ${{ inputs.iterations || '1000000' }}
          # A race the attacker never got into fails here rather than skipping: this run
          # exists to fight them and measure what they come to.
          CAPDOTNET_STRESS_REQUIRE_CONTEST: "1"
        run: |
          $env:CAPDOTNET_STRESS_REPORT = $env:GITHUB_STEP_SUMMARY
          dotnet test tests/Cap.Stress.Tests/Cap.Stress.Tests.csproj --configuration Release --no-build
          exit $LASTEXITCODE

  # -------------------------------------------------------------------------------------
  # The fuzz targets in fuzz/Cap.Fuzz, each under libFuzzer for an hour: path parsing, the
  # reparse-point reader, the walk over a simulated tree whose links the fuzzer chooses, and
  # the in-memory confined open over the same trees, held to the walk's answers.
  # Linux only, since the driver talks to the harness over System V shared memory. None of
  # the targets touches the host filesystem, so what they find does not depend on the OS they
  # run on.
  #
  # Each target starts from the escape corpus plus whatever inputs earlier runs kept because
  # they reached something new, carried between runs in the Actions cache. The cache drops an
  # entry unused for a week, and the oldest entries once the repository's share is full, so
  # Sunday's scheduled run also uploads each corpus as an artifact kept for 90 days. A run
  # whose cache restores nothing downloads the newest of those from a run on main instead,
  # which is what `actions: read` is for. Having neither costs only the time to find those
  # inputs again.
  #
  # An input that crashes or hangs a target fails the job and is uploaded as an artifact laid
  # out as fuzz/regressions/<target>/<file>. Unzipped at the root of a checkout it lands where
  # the replay tests look, and committing it makes it a regression test. Nothing is committed
  # from here: this job holds a read-only token. The artifact is kept for 90 days, so a
  # failure has time to be triaged from the `nightly` issue the report job opens. Anyone who
  # can see the repository can download it, so once a finding that reaches outside the
  # sandbox has its input saved somewhere private, delete the artifact from the run.
  # -------------------------------------------------------------------------------------
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [cap-path, reparse-data, resolution, resolution-memory]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the inputs earlier runs kept
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Download the last weekly copy of the inputs instead
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: fuzz-corpus-${{ matrix.target }}
        run: |
          run=$(gh api "repos/$GH_REPO/actions/artifacts?name=$NAME&per_page=100" --jq '
            [.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
            | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run" ]; then
            echo "::warning::No cached or weekly copy of the $NAME inputs; starting from the escape corpus alone."
            exit 0
          fi
          gh run download "$run" --name "$NAME" --dir "artifacts/fuzz/corpus/${{ matrix.target }}"
          echo "Restored $(ls "artifacts/fuzz/corpus/${{ matrix.target }}" | wc -l) inputs from run $run."

      - name: Seed from the escape corpus
        env:
          CAPDOTNET_FUZZ_SEEDS: ${{ github.workspace }}/artifacts/fuzz/corpus
        run: >
          dotnet test tests/Cap.Fuzz.Tests/Cap.Fuzz.Tests.csproj --configuration Release
          --filter-method "*.Seeds_are_written_out_when_asked"

      - name: Fuzz ${{ matrix.target }}
        run: build/fuzz/run.sh ${{ matrix.target }} ${{ inputs.fuzz_seconds || '3600' }}

      - name: Keep the inputs this run found
        if: always()
        uses: actions/cache/save@v6
        with:
          path: artifacts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Keep a weekly copy of the inputs outside the cache
        if: always() && github.event.schedule == '23 3 * * 0'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: artifacts/fuzz/corpus/${{ matrix.target }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Collect the inputs that failed
        if: failure()
        shell: bash
        run: |
          mkdir -p findings
          git ls-files --others --exclude-standard -z fuzz/regressions | xargs -0 --no-run-if-empty cp --parents -t findings
          {
            echo "### ${{ matrix.target }}: failing inputs"
            echo
            echo "Unzip the fuzz-findings-${{ matrix.target }} artifact at the root of a checkout, then run"
            echo '`dotnet run --project fuzz/Cap.Fuzz -- replay ${{ matrix.target }} fuzz/regressions/${{ matrix.target }}`'
            echo "to reproduce. See docs/fuzzing.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: findings/
          retention-days: 90
          if-no-files-found: ignore

  # -------------------------------------------------------------------------------------
  # 32-bit ARM, under glibc and musl, emulated. The Linux backend carries a table of flag
  # values and syscall numbers per architecture, and on this one also sends file offsets,
  # timestamps and filesystem sizes to the kernel by number, because the C library's default
  # calls take 32-bit ones. The per-table literals are asserted on every leg of ci.yml; this
  # is where the calls themselves are made against a 32-bit ARM kernel interface. There is
  # no hosted 32-bit ARM runner, so the build is published for the target on an ordinary
  # agent and run in the runtime's own arm32v7 image under QEMU, which is too slow and too
  # much of its own moving part to gate every change on.
  #
  # What running under a user-mode emulator changes, and how each is handled:
  # - The runtime's write-xor-execute double mapping of generated code is not something QEMU
  #   emulates faithfully; with it on, the process dies at random with an illegal
  #   instruction or an access violation. It is turned off.
  # - To suspend a thread for a collection, the runtime signals it and points the interrupted
  #   context at its own code, writing the address with the Thumb bit set as it keeps it.
  #   The hardware ignores that bit on the return from the signal; QEMU restores the address
  #   as it is and aborts translating it ("Assertion failed: (dc->base.pc_next & 1) == 0").
  #   The escape corpus, long enough to collect mid-case, did so on every run. Injection is
  #   turned off, leaving the runtime to suspend threads at its polling points.
  # - QEMU answers some of /proc/self itself. A file under it opened by absolute path is the
  #   emulator's version and the same file opened beneath a directory handle is the kernel's,
  #   so the one test comparing the two is excluded here.
  # - The seccomp-driven demotion tests skip themselves: a filter installed under the
  #   emulator would filter the emulator's own syscalls, not the emulated program's.
  #
  # Unprivileged, because the escape corpus refuses to run where file permissions can be
  # bypassed, and a container's default user can. The checkout is mounted at its own path so
  # the tests that read the docs find the repository above the published assemblies.
  # -------------------------------------------------------------------------------------
  linux-arm:
    name: linux-arm (${{ matrix.libc }}, emulated)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            rid: linux-arm
            image: mcr.microsoft.com/dotnet/runtime-deps:10.0-noble-arm32v7
          - libc: musl
            rid: linux-musl-arm
            image: mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine-arm32v7

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Publish the tests for ${{ matrix.rid }}
        run: |
          for project in Cap.Primitives.Tests Cap.Std.Tests Cap.Escape.Tests; do
            dotnet publish "tests/$project/$project.csproj" --configuration Release \
              --runtime ${{ matrix.rid }} --self-contained --output "artifacts/arm/$project"
          done

      - name: Run the tests under emulation
        run: |
          status=0
          for project in Cap.Primitives.Tests Cap.Std.Tests Cap.Escape.Tests; do
            echo "::group::$project"
            docker run --rm --platform linux/arm/v7 \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
              --env DOTNET_EnableWriteXorExecute=0 \
              --env DOTNET_INTERNAL_ThreadSuspendInjection=0 \
              --volume "$PWD:$PWD" \
              --workdir "$PWD/artifacts/arm/$project" \
              ${{ matrix.image }} \
              "./$project" \
              -method- "Cap.Std.Tests.DirFileOpenTests.A_file_longer_than_it_reports_is_read_to_its_end" \
              && code=0 || code=$?
            echo "::endgroup::"
            # The test process is the container's first process, so nothing prints a message when
            # it dies of a signal, and a crash after the summary is otherwise silent.
            if [ "$code" -ne 0 ]; then
              status=1
              if [ "$code" -gt 128 ]; then
                echo "::error title=$project (${{ matrix.libc }})::Exited with $code, killed by signal $((code - 128)) ($(kill -l $((code - 128)) 2>/dev/null || echo unknown))."
              else
                echo "::error title=$project (${{ matrix.libc }})::Exited with $code."
              fi
            fi
          done
          exit $status

  # -------------------------------------------------------------------------------------
  # The same property tests that run on every change at two thousand cases each, run here at
  # a million. A property that fails once in a million cases is only found at this size.
  # -------------------------------------------------------------------------------------
  properties:
    name: properties at full size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run the property tests at a million cases
        env:
          CAPDOTNET_PROPERTY_ITERATIONS: "1000000"
        run: dotnet test tests/Cap.Fuzz.Tests/Cap.Fuzz.Tests.csproj --configuration Release

  # -------------------------------------------------------------------------------------
  # A failed night is reported as an issue labelled `nightly`, since GitHub's own email goes
  # to whoever last touched this file, which after a dependabot bump is the bot. While one
  # such issue is open, each later failure comments on it rather than opening another, so a
  # red streak is one issue with a run link per night. Nothing closes it: a green night does
  # not mean the failure, or an input the fuzzer saved, has been looked at. The release
  # checklist asks for no open `nightly` issue.
  #
  # Only runs on main report: the scheduled run, and one started by hand on main, which is
  # how to try this job out. A run started by hand on a branch is watched by whoever started
  # it.
  # -------------------------------------------------------------------------------------
  report:
    name: report failure
    needs: [stress, fuzz, linux-arm, properties]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 10

    steps:
      - name: Open or comment on the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | "`\(.key)` (\(.value.result))"] | join(", ")' <<< "$NEEDS")
          body=$(printf '%s\n\n- Run: %s\n- Commit: %s\n- Trigger: %s\n- Jobs not green: %s\n' \
            "Nightly failed on $(date -u +%F)." "$RUN_URL" "$GITHUB_SHA" "$EVENT" "$failed")

          gh label create nightly --color B60205 \
            --description "A nightly stress, fuzz or property run failed" --force

          number=$(gh issue list --label nightly --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            note="Later failures comment here while this issue is open. Close it once every failure it records has been triaged; a green night does not close it."
            gh issue create --title "Nightly failed" --label nightly --body "$body"$'\n\n'"$note"
          fi
