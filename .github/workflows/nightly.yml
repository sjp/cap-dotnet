name: Nightly stress and fuzzing

# ---------------------------------------------------------------------------------------
# Work too slow for every change: the stress races at full size, the fuzz targets for an hour
# each, and the property tests at a million cases.
#
# The races in tests/Cap.Stress.Tests at full size. The same tests run on every change at a
# size that finishes in seconds, which shows the harness still stages its races and still
# tells their outcomes apart; a race lost once in a million attempts is only found here.
#
# What fails the run is the same at both sizes: an attempt that reached outside the sandbox,
# an attempt that reached something the race cannot vouch for, anything outside changed, or a
# descriptor left open. The rest of what the races count -- above all how often a resolution
# was steered to a different object inside -- is the measurement, and is written to the job
# summary, where the figures quoted in docs/threat-model.md come from.
# ---------------------------------------------------------------------------------------

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Attempts per race and backend
        default: "1000000"
      fuzz_seconds:
        description: Seconds per fuzz target
        default: "3600"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  stress:
    name: stress (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux backends run on each Linux leg, one after the other in one process: the
          # suite substitutes the walk for the confined open itself, the same way the escape
          # corpus does, so no separate forced-fallback leg is needed.
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Cap.Stress.Tests/Cap.Stress.Tests.csproj --configuration Release

      - name: Run the races at full size
        shell: bash
        env:
          CAPDOTNET_STRESS_ITERATIONS: ${{ inputs.iterations || '1000000' }}
        run: |
          export CAPDOTNET_STRESS_REPORT="$GITHUB_STEP_SUMMARY"
          dotnet test tests/Cap.Stress.Tests/Cap.Stress.Tests.csproj --configuration Release --no-build

  # -------------------------------------------------------------------------------------
  # The fuzz targets in fuzz/Cap.Fuzz, each under libFuzzer for an hour: path parsing, the
  # reparse-point reader, and the walk over a simulated tree whose links the fuzzer chooses.
  # Linux only, since the driver talks to the harness over System V shared memory. None of
  # the targets touches the host filesystem, so what they find does not depend on the OS they
  # run on.
  #
  # Each target starts from the escape corpus plus whatever inputs earlier runs kept because
  # they reached something new, carried between runs in the Actions cache. A lost cache costs
  # only the time to find those inputs again.
  #
  # An input that crashes or hangs a target fails the job and is uploaded as an artifact laid
  # out as fuzz/regressions/<target>/<file>. Unzipped at the root of a checkout it lands where
  # the replay tests look, and committing it makes it a regression test. Nothing is committed
  # from here: this job holds a read-only token, and the artifact is kept for a week.
  # -------------------------------------------------------------------------------------
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [cap-path, reparse-data, resolution]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore the inputs earlier runs kept
        uses: actions/cache/restore@v4
        with:
          path: artifacts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed from the escape corpus
        env:
          CAPDOTNET_FUZZ_SEEDS: ${{ github.workspace }}/artifacts/fuzz/corpus
        run: >
          dotnet test tests/Cap.Fuzz.Tests/Cap.Fuzz.Tests.csproj --configuration Release
          --filter-method "*.Seeds_are_written_out_when_asked"

      - name: Fuzz ${{ matrix.target }}
        run: build/fuzz/run.sh ${{ matrix.target }} ${{ inputs.fuzz_seconds || '3600' }}

      - name: Keep the inputs this run found
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Collect the inputs that failed
        if: failure()
        shell: bash
        run: |
          mkdir -p findings
          git ls-files --others --exclude-standard -z fuzz/regressions | xargs -0 --no-run-if-empty cp --parents -t findings
          {
            echo "### ${{ matrix.target }}: failing inputs"
            echo
            echo "Unzip the fuzz-findings-${{ matrix.target }} artifact at the root of a checkout, then run"
            echo '`dotnet run --project fuzz/Cap.Fuzz -- replay ${{ matrix.target }} fuzz/regressions/${{ matrix.target }}`'
            echo "to reproduce. See docs/fuzzing.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: findings/
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------------------------
  # The same property tests that run on every change at two thousand cases each, run here at
  # a million. A property that fails once in a million cases is only found at this size.
  # -------------------------------------------------------------------------------------
  properties:
    name: properties at full size
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run the property tests at a million cases
        env:
          CAPDOTNET_PROPERTY_ITERATIONS: "1000000"
        run: dotnet test tests/Cap.Fuzz.Tests/Cap.Fuzz.Tests.csproj --configuration Release
