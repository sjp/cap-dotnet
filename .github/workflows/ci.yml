name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # ---------------------------------------------------------------------------------
  # The three resolution backends (openat2, portable walk, Windows) are
  # genuinely different implementations of the same guarantee. A green Ubuntu build says
  # nothing about the other two, so every leg here is load-bearing.
  # ---------------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64 (openat2)
            os: ubuntu-latest
          - name: linux-x64 (forced fallback)
            os: ubuntu-latest
            # Exercises the portable walk on a kernel that would otherwise take the openat2 fast path.
            # An AppContext switch rather than a #if, so this is the *same binary* users
            # ship -- and so users can disable openat2 themselves if a kernel regresses.
            disable_openat2: "1"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            # Catches syscall-number and struct-layout mistakes. A wrong `open_how` size
            # makes openat2 return EINVAL, which silently demotes everyone to the
            # fallback -- tests still pass, and the fast path is never exercised again.
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build CapDotnet.slnx --configuration Release

      - name: Test
        env:
          # See docs/backends.md. Read by the capability probe in Cap.Primitives.
          CAPDOTNET_DISABLE_OPENAT2: ${{ matrix.disable_openat2 }}
        run: >
          dotnet test CapDotnet.slnx --configuration Release --no-build
          -- --coverage --coverage-output-format cobertura

      - name: Assert the fallback leg really did not call openat2
        # A forced-fallback job that quietly keeps using openat2 tests nothing. The openat2
        # backend must expose a counter for this. Non-blocking until it does, but it stays visible
        # rather than being deleted and forgotten.
        if: matrix.disable_openat2 == '1'
        continue-on-error: true
        run: |
          echo "TODO: assert the openat2 call counter is zero, or strace the run."
          exit 1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: "**/*.cobertura.xml"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  # Symlink, bind-mount and case-folding behaviour differ per filesystem. Running the
  # escape corpus only on the runner's root ext4 volume would leave overlayfs (every
  # container) and case-insensitive volumes untested.
  # ---------------------------------------------------------------------------------
  filesystems:
    name: escape corpus on ${{ matrix.fs }}
    runs-on: ubuntu-latest
    # Non-blocking until the escape corpus has cases to run. See the note at the end of this file.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        fs: [tmpfs, ext4, overlayfs, vfat-case-insensitive]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Provision ${{ matrix.fs }} at /mnt/captest
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/captest
          case "${{ matrix.fs }}" in
            tmpfs)
              sudo mount -t tmpfs -o size=512m tmpfs /mnt/captest
              ;;
            ext4)
              sudo fallocate -l 512M /tmp/captest.img
              sudo mkfs.ext4 -q /tmp/captest.img
              sudo mount -o loop /tmp/captest.img /mnt/captest
              ;;
            overlayfs)
              sudo mkdir -p /tmp/ovl/{lower,upper,work}
              sudo mount -t overlay overlay \
                -o lowerdir=/tmp/ovl/lower,upperdir=/tmp/ovl/upper,workdir=/tmp/ovl/work \
                /mnt/captest
              ;;
            vfat-case-insensitive)
              # vfat is case-insensitive and has no symlinks at all, which is itself a
              # case worth covering: CreateSymlink must fail cleanly, not half-succeed.
              sudo fallocate -l 512M /tmp/captest.img
              sudo mkfs.vfat /tmp/captest.img
              sudo mount -o loop,uid=$(id -u),gid=$(id -g) /tmp/captest.img /mnt/captest
              ;;
          esac
          sudo chown "$(id -u):$(id -g)" /mnt/captest
          mount | grep /mnt/captest

      - name: Run the escape corpus against ${{ matrix.fs }}
        env:
          # The escape corpus reads this to place its fixtures.
          CAPDOTNET_TEST_ROOT: /mnt/captest
        run: >
          dotnet test tests/Cap.Escape.Tests/Cap.Escape.Tests.csproj
          --configuration Release

  # ---------------------------------------------------------------------------------
  # openat2 landed in Linux 5.6, and seccomp filters (Docker's default profile, for one)
  # can make it return EPERM on a kernel that has it. The fallback is therefore not a
  # legacy path -- it is the path a large fraction of real deployments take.
  # ---------------------------------------------------------------------------------
  no-openat2:
    name: openat2 unavailable (ENOSYS / EPERM)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run under a seccomp profile that denies openat2
        run: |
          echo "TODO: run the suite under a seccomp profile returning EPERM for"
          echo "openat2, and separately one returning ENOSYS. The probe must cache *both*"
          echo "and must not retry per call."
          exit 1

  # ---------------------------------------------------------------------------------
  # Passing the escape corpus under NativeAOT is the real test; merely linking is not.
  # ---------------------------------------------------------------------------------
  nativeaot:
    name: NativeAOT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish AOT and run the corpus against the AOT binary
        run: |
          echo "TODO: publish tests/Cap.Escape.Tests with PublishAot=true and run it."
          exit 1

  # ---------------------------------------------------------------------------------
  # Cap.Primitives is the containment core: every line of it is either a resolution step
  # or a parse decision, so a silent drop in coverage there means an untested path through
  # the part of the tree that the whole guarantee rests on. The other assemblies are thin
  # by comparison and are not gated.
  # ---------------------------------------------------------------------------------
  coverage-gate:
    name: coverage gate (Cap.Primitives)
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Fail on a coverage drop in Cap.Primitives
        run: |
          echo "TODO: read the cobertura reports under coverage/, take the line and branch"
          echo "rate for Cap.Primitives, and fail if either falls below the committed"
          echo "threshold. Blocked until Cap.Primitives has code: a rate computed over an"
          echo "empty assembly is not a number worth gating on."
          exit 1

  # ---------------------------------------------------------------------------------
  lint:
    name: format + analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: dotnet format --verify-no-changes
        run: dotnet format CapDotnet.slnx --verify-no-changes --severity warn

# ---------------------------------------------------------------------------------------
# Jobs marked `continue-on-error: true` are scaffolded ahead of the code they test and
# currently fail on purpose. They are non-blocking so that a trivial PR is green, but they
# are deliberately *not* commented out: a job that does not exist is a job nobody
# remembers to write. Each one drops its `continue-on-error` line once the code it exercises exists:
#
#   filesystems   -> the escape corpus
#   no-openat2    -> the openat2 capability probe
#   nativeaot     -> AOT + trimming validation
#   coverage-gate -> any code in Cap.Primitives to measure
#   the openat2-counter assertion in build-test -> the openat2 call counter
#
# Still to add:
#   - a nightly schedule for TOCTOU stress (>=1e6 iterations) and fuzzing, which are far
#     too slow for per-PR. Both are recorded as acceptance criteria on their own work,
#     so this note is a convenience rather than the only record.
# ---------------------------------------------------------------------------------------
