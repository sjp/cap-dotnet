name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Every test that waits on a child process is bounded (tests/Shared/ChildProcessWait.cs);
    # this catches whatever hang is left, at 45 minutes rather than GitHub's six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64 (openat2)
            os: ubuntu-latest
          - name: linux-x64 (openat2 denied, in memory)
            os: ubuntu-latest
            passes_only: true
            deny_openat2: EPERM
            in_memory: [in-memory-walk]
          - name: linux-x64 (forced fallback)
            os: ubuntu-latest
            # Exercises the portable walk on a kernel that would otherwise take the openat2 fast path.
            # An AppContext switch rather than a #if, so this is the *same binary* users
            # ship -- and so users can disable openat2 themselves if a kernel regresses.
            disable_openat2: "1"
            deny_openat2: ENOSYS
            in_memory: [in-memory-confined]
          - name: linux-arm64
            os: ubuntu-24.04-arm
            # Catches syscall-number and struct-layout mistakes. A wrong `open_how` size
            # makes openat2 return EINVAL, which silently demotes everyone to the
            # fallback -- tests still pass, and the fast path is never exercised again.
          - name: windows-x64
            os: windows-latest
          # The release before windows-latest, still the most common server a library like this
          # is deployed to. Same steps as the leg above, on an older kernel and NTFS driver.
          - name: windows-x64 (Server 2022)
            os: windows-2022
          - name: windows-x64 (in memory)
            os: windows-latest
            passes_only: true
            in_memory: [in-memory-walk, in-memory-confined]
          - name: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        id: build
        run: dotnet build CapDotnet.slnx --configuration Release

      # ---------------------------------------------------------------------------------
      # A test that needs a symbolic link, a hard link, a junction, /proc or a FIFO stands aside
      # on a host that cannot make one. These runners can, so the suite is told to expect them, and
      # a runner that lost one -- the elevated token Windows needs for links, say, or a masked
      # /proc -- fails the leg instead of passing with the heart of the corpus skipped.
      # ---------------------------------------------------------------------------------
      - name: Expect the host features this runner provides
        shell: pwsh
        run: |
          $features = @{
            Linux   = 'Symlinks,HardLinks,ProcessFilesystem,PosixNames,SpecialFiles'
            Windows = 'Symlinks,HardLinks,Junctions,CaseInsensitive'
            macOS   = 'Symlinks,HardLinks,PosixNames,SpecialFiles,CaseInsensitive'
          }['${{ runner.os }}']
          "CAPDOTNET_EXPECT_HOST_FEATURES=$features" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------------------------
      # The in-memory filesystem in Cap.Std.Testing is only worth having if it behaves like the
      # disk, and a second set of tests written for it would encode the same assumptions twice.
      # So the suites that pin down the disk's behaviour run again here, unchanged, with it
      # standing in for the host (see tests/InMemory): resolving one name at a time, and a whole
      # path at once, under the path rules of each runner's platform.
      #
      # PowerShell rather than bash. On Windows bash is the MSYS2 runtime, which enables the
      # backup and restore privileges in an administrator's token, and every test process it
      # starts inherits them -- which the suite refuses to run with, since a process that can
      # bypass file permissions passes negative containment tests for the wrong reason.
      # ---------------------------------------------------------------------------------
      - name: Run the suites with the in-memory backend in place of the host
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.in_memory }}
        shell: pwsh
        run: |
          $failed = 0
          foreach ($leg in '${{ join(matrix.in_memory, ' ') }}' -split ' ') {
            # Read by tests/InMemory before the first test.
            $env:CAPDOTNET_TEST_BACKEND = $leg
            # The in-memory filesystem has links and hard links, FIFOs under Unix rules and
            # junctions under Windows rules, and nothing the host alone has.
            $env:CAPDOTNET_EXPECT_HOST_FEATURES = if ($IsWindows) { 'Symlinks,HardLinks,Junctions' } else { 'Symlinks,HardLinks,SpecialFiles' }
            foreach ($project in 'Cap.Std.Tests', 'Cap.Fs.Ext.Tests', 'Cap.Escape.Tests') {
              "::group::$project ($leg)"
              dotnet test "tests/$project/$project.csproj" --configuration Release --no-build
              if ($LASTEXITCODE -ne 0) { $failed = $LASTEXITCODE }
              "::endgroup::"
            }
          }
          exit $failed

      # A test about something only the host has stands aside with its reason. The summary lists
      # them and how many there are, because each is a test the in-memory backend is excused
      # from, and the count should only grow for a reason somebody has read.
      - name: List the tests not run in memory
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.in_memory }}
        shell: bash
        run: >
          build/ci/list-in-memory-opt-outs.sh Cap.Std.Tests Cap.Fs.Ext.Tests Cap.Escape.Tests
          | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------------------
      # openat2 landed in Linux 5.6, and seccomp filters (Docker's default profile, for one)
      # can make it return EPERM on a kernel that has it. The fallback is therefore not a
      # legacy path -- it is the path a large fraction of real deployments take.
      #
      # The two ways a host refuses, one on each x64 leg. A kernel older than the syscall says
      # it is not implemented; a kernel that has it, behind a filter that takes it away, says
      # permission denied. Both must reach the same conclusion, and recognising only one would
      # leave the other surfacing as an unexplained failure from operations that have nothing
      # to do with permissions.
      # ---------------------------------------------------------------------------------
      - name: Run the suite with openat2 denied by the kernel (${{ matrix.deny_openat2 }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.deny_openat2 }}
        env:
          CAPDOTNET_TEST_DENY_OPENAT2: ${{ matrix.deny_openat2 }}
        run: >
          dotnet test CapDotnet.slnx --configuration Release --no-build

      # ---------------------------------------------------------------------------------
      # A short-name alias reaches the same file as the long name it was derived from, so a
      # rule a caller states about one spelling is defeated by the other. The backend refuses
      # an alias, and the only way to know it does is to run on a volume that generates them.
      # Generation is off by default on non-system volumes, so it is turned on here and the
      # suite is told to expect it: a case that quietly stood aside would leave the defence
      # untested on every leg.
      # ---------------------------------------------------------------------------------
      - name: Enable 8.3 short-name generation on the volume the tests run on
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' && !matrix.passes_only }}
        shell: pwsh
        run: |
          $volume = (Split-Path -Qualifier ([System.IO.Path]::GetTempPath()))
          fsutil 8dot3name set $volume 0
          fsutil 8dot3name query $volume
          "CAPDOTNET_EXPECT_SHORT_NAMES=1" >> $env:GITHUB_ENV

      - name: Prepare a bind mount for the escape corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' && !matrix.passes_only }}
        run: |
          # Assigned first so a failed mount fails the step; inside echo its status is lost.
          mount="$(build/ci/prepare-bind-mount.sh "$RUNNER_TEMP")"
          echo "CAPDOTNET_TEST_BIND_MOUNT=$mount" >> "$GITHUB_ENV"
          echo "CAPDOTNET_EXPECT_BIND_MOUNT=1" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------------------
      # The WebAssembly WASI test suite's programs, run against the WASI host sample. Fetched
      # at a pinned commit rather than kept in the repository, since they come to about a
      # hundred megabytes. The list of programs expected to fail was recorded on Linux, so the
      # suite runs on the Linux legs; elsewhere its cases skip.
      # ---------------------------------------------------------------------------------
      - name: Fetch the WASI test suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' && !matrix.passes_only }}
        run: |
          testsuite="$(build/ci/fetch-wasi-testsuite.sh "$RUNNER_TEMP")"
          echo "CAPDOTNET_WASI_TESTSUITE=$testsuite" >> "$GITHUB_ENV"
          echo "CAPDOTNET_EXPECT_WASI_TESTSUITE=1" >> "$GITHUB_ENV"

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !matrix.passes_only }}
        env:
          CAPDOTNET_DISABLE_OPENAT2: ${{ matrix.disable_openat2 }}
        run: >
          dotnet test CapDotnet.slnx --configuration Release --no-build
          -- --coverage --coverage-output-format cobertura

      # ---------------------------------------------------------------------------------
      # The documentation promises symbolic links to accounts in Developer Mode, which the
      # platform's own API grants with a flag this backend has no way to pass: it writes the
      # link data itself. So the comparison with that API is run again with Developer Mode on,
      # where the API makes the link without the privilege and the backend has to as well.
      # After the full suite rather than before it, because with Developer Mode on the case that
      # takes the privilege away has no refusal left to observe, and would stand aside.
      # ---------------------------------------------------------------------------------
      - name: Compare link creation with the platform's in Developer Mode
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' && !matrix.passes_only }}
        shell: pwsh
        env:
          CAPDOTNET_EXPECT_DEVELOPER_MODE: '1'
        run: |
          reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Cap.Primitives.Tests/Cap.Primitives.Tests.csproj --configuration Release --no-build `
            -- --filter-method '*Links_can_be_made_here_wherever_the_platform_makes_them*'
          exit $LASTEXITCODE

      - name: Run the samples
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !matrix.passes_only }}
        shell: bash
        run: |
          set -euo pipefail
          for project in samples/ContainmentCheck samples/StaticFileServer samples/PluginHost/Host \
                         samples/ArchiveExtractor samples/AmbientAudit samples/WasiHost/Host \
                         samples/TestableComponent/App; do
            echo "::group::$project"
            dotnet run --project "$project" --configuration Release --no-build
            echo "::endgroup::"
          done

      # ---------------------------------------------------------------------------------
      # The macOS backend is two sets of imports chosen by architecture: on Intel the stat and
      # directory calls go through their $INODE64 spellings and the variadic openat and fcntl
      # take their last argument in a register, where Apple silicon uses the plain names and the
      # stack. A wrong spelling or a wrong choice does not fail at build time, and on the wrong
      # layout does not fail at all -- it reads a plausible size and a half-width inode. So the
      # suites that reach those calls run again here as an Intel process, under Rosetta, which
      # runs the C library's Intel entry points and calling convention as an Intel Mac would.
      #
      # The assemblies built above are architecture-neutral; what decides the process's
      # architecture is the host that starts them. `dotnet test` would start each project's own
      # launcher, which the build made native, so each assembly is started through an Intel
      # `dotnet` instead, and CAPDOTNET_EXPECT_PROCESS_ARCHITECTURE fails the run if it came up
      # as anything else.
      # ---------------------------------------------------------------------------------
      - name: Run the suites as an Intel process under Rosetta
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' && !matrix.passes_only }}
        shell: bash
        env:
          CAPDOTNET_EXPECT_PROCESS_ARCHITECTURE: X64
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

          x64="$RUNNER_TEMP/dotnet-x64"
          curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --architecture x64 \
            --install-dir "$x64" --no-path
          export DOTNET_ROOT="$x64" DOTNET_ROOT_X64="$x64"
          arch -x86_64 "$x64/dotnet" --info | grep -E '^[[:space:]]*(Architecture|RID):'

          status=0
          for project in Cap.Primitives.Tests Cap.Std.Tests Cap.Fs.Ext.Tests Cap.Escape.Tests; do
            echo "::group::$project (x64)"
            arch -x86_64 "$x64/dotnet" exec "tests/$project/bin/Release/net10.0/$project.dll" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload coverage
        if: ${{ always() && !matrix.passes_only }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: "**/*.cobertura.xml"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  # The Linux backend calls the C library for openat, fcntl, fstatfs and syscall itself, and
  # every other Linux leg on every change runs on glibc. musl declares some of those
  # differently and is what Alpine-based containers ship, so the resolver's tests and the
  # escape corpus run again on it: published for linux-musl-x64 here and run in the runtime's
  # Alpine image, as the nightly 32-bit ARM legs are.
  #
  # The bind mount is made on the runner, where sudo is, and reaches the container through the
  # volume that holds it. The container runs as the runner's own user, because the escape
  # corpus refuses to run where file permissions can be bypassed, and a container's default
  # user can. The checkout is mounted at its own path so the tests that read the docs find
  # the repository above the published assemblies.
  # ---------------------------------------------------------------------------------
  musl:
    name: linux-x64 (musl, Alpine)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish the tests for linux-musl-x64
        run: |
          for project in Cap.Primitives.Tests Cap.Escape.Tests; do
            dotnet publish "tests/$project/$project.csproj" --configuration Release \
              --runtime linux-musl-x64 --self-contained --output "artifacts/musl/$project"
          done

      - name: Prepare a bind mount for the escape corpus
        run: |
          mount="$(build/ci/prepare-bind-mount.sh "$RUNNER_TEMP")"
          echo "CAPDOTNET_TEST_BIND_MOUNT=$mount" >> "$GITHUB_ENV"

      - name: Run the tests on musl
        run: |
          status=0
          for project in Cap.Primitives.Tests Cap.Escape.Tests; do
            echo "::group::$project"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env CI \
              --env CAPDOTNET_TEST_BIND_MOUNT \
              --env CAPDOTNET_EXPECT_BIND_MOUNT=1 \
              --env CAPDOTNET_EXPECT_HOST_FEATURES=Symlinks,HardLinks,ProcessFilesystem,PosixNames,SpecialFiles \
              --volume "$PWD:$PWD" \
              --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
              --workdir "$PWD/artifacts/musl/$project" \
              mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine \
              "./$project" \
              || status=1
            echo "::endgroup::"
          done
          exit $status

  filesystems:
    name: escape corpus on ${{ matrix.fs }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fs: [tmpfs, ext4, overlayfs, vfat-case-insensitive]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision ${{ matrix.fs }} at /mnt/captest
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/captest
          case "${{ matrix.fs }}" in
            tmpfs)
              sudo mount -t tmpfs -o size=512m tmpfs /mnt/captest
              ;;
            ext4)
              sudo fallocate -l 512M /tmp/captest.img
              sudo mkfs.ext4 -q /tmp/captest.img
              sudo mount -o loop /tmp/captest.img /mnt/captest
              ;;
            overlayfs)
              sudo mkdir -p /tmp/ovl/{lower,upper,work}
              sudo mount -t overlay overlay \
                -o lowerdir=/tmp/ovl/lower,upperdir=/tmp/ovl/upper,workdir=/tmp/ovl/work \
                /mnt/captest
              ;;
            vfat-case-insensitive)
              # vfat is case-insensitive and has no symlinks at all, which is itself a
              # case worth covering: CreateSymlink must fail cleanly, not half-succeed.
              sudo fallocate -l 512M /tmp/captest.img
              sudo mkfs.vfat /tmp/captest.img
              sudo mount -o loop,uid=$(id -u),gid=$(id -g) /tmp/captest.img /mnt/captest
              ;;
          esac
          sudo chown "$(id -u):$(id -g)" /mnt/captest
          mount | grep /mnt/captest

      # Placed on the runner's own volume rather than the one under test: the fixture needs
      # symbolic links, and vfat has none.
      - name: Prepare a bind mount for the escape corpus
        run: |
          # Assigned first so a failed mount fails the step; inside echo its status is lost.
          mount="$(build/ci/prepare-bind-mount.sh "$RUNNER_TEMP")"
          echo "CAPDOTNET_TEST_BIND_MOUNT=$mount" >> "$GITHUB_ENV"
          echo "CAPDOTNET_EXPECT_BIND_MOUNT=1" >> "$GITHUB_ENV"

      # The runner's own volume is a different filesystem from every one mounted at
      # /mnt/captest, so a move or a link from the sandbox to it has to be refused as crossing
      # a device -- by the kernel, reported as such, and with neither tree changed.
      - name: Name a second volume for moves and links between filesystems
        run: |
          echo "CAPDOTNET_TEST_OTHER_VOLUME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CAPDOTNET_EXPECT_OTHER_VOLUME=1" >> "$GITHUB_ENV"

      - name: Run the escape corpus against ${{ matrix.fs }}
        env:
          # The escape corpus reads this to place its fixtures. It probes the volume for what
          # it can hold -- links, hard links, the characters Windows reserves, case and
          # normalisation folding -- and adapts each case rather than assuming ext4.
          CAPDOTNET_TEST_ROOT: /mnt/captest
          # What each volume must turn out to hold, so that a case needing it fails rather than
          # stands aside where it is missing. vfat holds no links of either kind and no FIFOs,
          # and is here to show that making a link is refused.
          CAPDOTNET_EXPECT_HOST_FEATURES: >-
            ${{ matrix.fs == 'vfat-case-insensitive' && 'CaseInsensitive'
            || 'Symlinks,HardLinks,ProcessFilesystem,PosixNames,SpecialFiles' }}
        run: >
          dotnet test tests/Cap.Escape.Tests/Cap.Escape.Tests.csproj
          --configuration Release

  nativeaot:
    name: NativeAOT and trimming (${{ matrix.name }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            parts: [native, single-file, sample]
          - name: windows-x64
            shard: native
            os: windows-latest
            parts: [native]
          - name: windows-x64
            shard: single file
            os: windows-latest
            parts: [single-file, sample]
          - name: macos-arm64
            os: macos-latest
            parts: [native, single-file, sample]
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      # As in build-test.
      - name: Expect the host features this runner provides
        run: |
          $features = @{
            Linux   = 'Symlinks,HardLinks,ProcessFilesystem,PosixNames,SpecialFiles'
            Windows = 'Symlinks,HardLinks,Junctions,CaseInsensitive'
            macOS   = 'Symlinks,HardLinks,PosixNames,SpecialFiles,CaseInsensitive'
          }['${{ runner.os }}']
          "CAPDOTNET_EXPECT_HOST_FEATURES=$features" >> $env:GITHUB_ENV

      - name: Enable 8.3 short-name generation on the volume the tests run on
        if: runner.os == 'Windows'
        run: |
          $volume = (Split-Path -Qualifier ([System.IO.Path]::GetTempPath()))
          fsutil 8dot3name set $volume 0
          fsutil 8dot3name query $volume
          "CAPDOTNET_EXPECT_SHORT_NAMES=1" >> $env:GITHUB_ENV

      - name: Prepare a bind mount for the escape corpus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Assigned first so a failed mount fails the step; inside echo its status is lost.
          mount="$(build/ci/prepare-bind-mount.sh "$RUNNER_TEMP")"
          echo "CAPDOTNET_TEST_BIND_MOUNT=$mount" >> "$GITHUB_ENV"
          echo "CAPDOTNET_EXPECT_BIND_MOUNT=1" >> "$GITHUB_ENV"

      - name: Publish the escape corpus as a NativeAOT executable
        if: contains(matrix.parts, 'native')
        run: >
          dotnet publish tests/Cap.Escape.Aot.Tests/Cap.Escape.Aot.Tests.csproj
          --configuration Release --use-current-runtime -p:CapPublishAs=native
          --output "${{ runner.temp }}/corpus-native"

      - name: Run the escape corpus as a NativeAOT executable
        if: contains(matrix.parts, 'native')
        run: '& "${{ runner.temp }}/corpus-native/Cap.Escape.Aot.Tests"'

      - name: Publish the escape corpus trimmed, as a single file
        if: contains(matrix.parts, 'single-file')
        run: >
          dotnet publish tests/Cap.Escape.Aot.Tests/Cap.Escape.Aot.Tests.csproj
          --configuration Release --use-current-runtime -p:CapPublishAs=single-file
          --output "${{ runner.temp }}/corpus-single-file"

      - name: Run the escape corpus trimmed, as a single file
        if: contains(matrix.parts, 'single-file')
        run: '& "${{ runner.temp }}/corpus-single-file/Cap.Escape.Aot.Tests"'

      - name: Publish the archive extractor sample as a NativeAOT executable
        if: contains(matrix.parts, 'sample')
        run: >
          dotnet publish samples/ArchiveExtractor/ArchiveExtractor.csproj
          --configuration Release --use-current-runtime
          --output "${{ runner.temp }}/sample"

      # With no arguments the sample extracts a hostile archive of its own and fails if
      # anything was written outside the destination.
      - name: Run the archive extractor sample
        if: contains(matrix.parts, 'sample')
        run: '& "${{ runner.temp }}/sample/ArchiveExtractor"'

      # The line carries the SDK and the runtime it compiled against, so docs/aot.md's table
      # can be refreshed by copying it. The runtime is the SDK's bundled one, which is the
      # version of the NativeAOT compiler and runtime pack the publish used.
      - name: Record the sample's size
        if: contains(matrix.parts, 'sample')
        run: |
          $binary = Get-ChildItem "${{ runner.temp }}/sample" |
            Where-Object { $_.BaseName -eq 'ArchiveExtractor' -and $_.Extension -in '', '.exe' }
          $sdk = dotnet --version
          $runtime = dotnet msbuild samples/ArchiveExtractor/ArchiveExtractor.csproj `
            -getProperty:BundledNETCoreAppPackageVersion
          if ($LASTEXITCODE -ne 0 -or -not $runtime) { throw "could not read the bundled runtime version" }
          $line = "ArchiveExtractor, NativeAOT, ${{ matrix.name }}: $($binary.Length) bytes " +
            "($([math]::Round($binary.Length / 1MB, 2)) MiB), SDK $sdk (runtime $($runtime.Trim()))"
          $line
          $line >> $env:GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------------
  # Fuzzing proper is nightly, and Cap.Fuzz.Tests already compiles the targets and replays
  # their saved inputs on every change. What only build/fuzz/run.sh does is fetch and build
  # the libFuzzer driver against its pinned digest and instrument the assemblies with
  # SharpFuzz, so this runs it briefly on two targets. Between them they drive both of the
  # instrumented assemblies: cap-path drives Cap.Primitives and resolution-memory drives
  # Cap.Std.Testing. The driver is built on every run rather than cached, so a wrong digest
  # fails here and not at the next night.
  #
  # Each run starts from an empty corpus, and libFuzzer has to keep at least one input it
  # generated. It keeps an input only for reaching a branch no earlier input reached, and
  # the only branches it can see in the target are the ones SharpFuzz instrumented, so with
  # no instrumentation it keeps none. The `cov:` figure libFuzzer prints is no use for this:
  # it counts the driver's own code and is the same with instrumentation or without.
  # ---------------------------------------------------------------------------------
  fuzz-smoke:
    name: fuzz harness smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Fuzz each target briefly and check that coverage reached libFuzzer
        run: |
          for target in cap-path resolution-memory; do
            echo "::group::$target"
            build/fuzz/run.sh "$target" 45 "$RUNNER_TEMP/fuzz-corpus" 2>&1 | tee "$RUNNER_TEMP/fuzz-$target.log"
            echo "::endgroup::"
            added=$(sed -n 's/^stat::new_units_added:[[:space:]]*//p' "$RUNNER_TEMP/fuzz-$target.log")
            if [ "${added:-0}" -eq 0 ]; then
              echo "::error::$target kept no inputs from an empty corpus, so libFuzzer saw no coverage from the instrumented assemblies"
              exit 1
            fi
            echo "$target kept $added inputs."
          done

  # ---------------------------------------------------------------------------------
  # Each leg's reports land in coverage/coverage-<leg name>, and every leg of build-test that
  # is not passes_only is listed, so a leg whose reports went missing fails the gate rather
  # than leaving it to judge a smaller union. Add a leg here when adding one to the matrix.
  #
  # The floors are a ratchet: raise them as coverage rises, and lower them only in a change
  # that says why (see docs/testing.md). The merged figure is in the job summary.
  # ---------------------------------------------------------------------------------
  coverage-gate:
    name: coverage gate (Cap.Primitives)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Fail on a coverage drop in Cap.Primitives
        run: >
          build/ci/check-coverage.sh coverage Cap.Primitives 0.47 0.45
          "coverage-linux-x64 (openat2)"
          "coverage-linux-x64 (forced fallback)"
          coverage-linux-arm64
          coverage-windows-x64
          "coverage-windows-x64 (Server 2022)"
          coverage-macos-arm64

  # Cap.IO.Abstractions depends on a minimum of each System.IO.Abstractions package, so a
  # consumer can install a newer one beside it; every other leg builds against the minimums.
  # The interfaces gain members in minor releases, and a member the adapter lacks makes
  # DirFileSystem fail to load. This leg builds and tests it against the newest stable
  # versions, so a red leg here means the adapter has new members to implement.
  io-abstractions-latest:
    name: Cap.IO.Abstractions against the newest upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Move the System.IO.Abstractions packages to their newest stable versions
        run: build/ci/use-latest-io-abstractions.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build and test
        run: dotnet test tests/Cap.IO.Abstractions.Tests/Cap.IO.Abstractions.Tests.csproj --configuration Release

  analyzer-package:
    name: analyzer ships in Cap.Std (consumer on ${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SDK global.json names, which the package is always packed with.
          - name: current SDK
            consumer-sdk: ""
          # The oldest SDK the analyzer is built to load in (docs/analyzers.md, "Compiler
          # floor"). Raise it together with Microsoft.CodeAnalysis.CSharp in
          # Directory.Packages.props.
          - name: SDK 10.0.100
            consumer-sdk: "10.0.100"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: matrix.consumer-sdk != ''
        with:
          dotnet-version: ${{ matrix.consumer-sdk }}
      # Last, so that it is the dotnet on PATH; both SDKs land in the same install.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pack, install into a fresh consumer, and check the diagnostics
        env:
          CAP_CONSUMER_SDK: ${{ matrix.consumer-sdk }}
        run: build/ci/verify-analyzer-package.sh "$RUNNER_TEMP/analyzer-package"

  packages:
    name: pack and check reproducibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Pack and check the contents
        run: build/ci/pack.sh "$RUNNER_TEMP/feed" "0.0.0-ci.${{ github.run_number }}"
      - name: Build again from another directory and compare the assemblies
        run: build/ci/check-reproducible.sh "$RUNNER_TEMP/reproducible"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/feed/*.nupkg
          retention-days: 7

  package-install:
    name: packages install (${{ matrix.name }})
    needs: packages
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/feed
      - name: Install into fresh consumers, build and run
        shell: bash
        run: >
          build/ci/verify-package-install.sh
          "${{ runner.temp }}/feed" "0.0.0-ci.${{ github.run_number }}" "${{ runner.temp }}/install"

  benchmark-gate:
    name: benchmark gate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Run the hot-path benchmarks and compare
        run: dotnet run --configuration Release --project bench/Cap.Benchmarks -- gate
      - name: Upload the figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-gate-${{ matrix.name }}
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  lint:
    name: format + analyzers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Dependabot bumps global.json and the devcontainer's SDK through different ecosystems.
      - name: devcontainer SDK matches global.json
        run: |
          test "$(jq -r .sdk.version global.json)" = "$(jq -r '.features["ghcr.io/devcontainers/features/dotnet:2"].version' .devcontainer/devcontainer.json)" \
            || { echo "::error::global.json and .devcontainer/devcontainer.json name different SDK versions"; exit 1; }
      # Every SDK a workflow installs is an exact version, never "latest in a band".
      - name: no wildcard SDK versions in workflows
        run: |
          if grep -rnE 'dotnet-version:\s*"?[0-9.]*\.?[xX*]' .github/workflows/; then
            echo "::error::a workflow installs a wildcard SDK version; name an exact one or use global-json-file"; exit 1
          fi
      # A published page must not carry a template token or a note to its author.
      - name: no placeholders in docs
        run: |
          if grep -rnE '[A-Z]+_PLACEHOLDER|\bTODO\b|\bFIXME\b|\bTBD\b' docs/ ./*.md; then
            echo "::error::docs/ or a top-level .md file holds a template token or TODO"; exit 1
          fi
      # Changes are written down as they land, under Unreleased; release.yml takes a version's
      # section as its notes.
      - name: CHANGELOG has an Unreleased section
        run: |
          grep -qxF '## [Unreleased]' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [Unreleased]' heading"; exit 1; }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: dotnet format --verify-no-changes
        run: dotnet format CapDotnet.slnx --verify-no-changes --severity warn
