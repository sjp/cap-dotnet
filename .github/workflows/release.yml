name: Release

# ---------------------------------------------------------------------------------------
# Pushing a tag vX.Y.Z builds that commit's packages, attests their provenance, installs them
# on every platform, and then publishes them to nuget.org and as a GitHub release.
#
# The steps before publishing are the ones CI runs on every change: the same pack script, the
# same content checks, the same reproducibility check, the same install on three platforms.
# A release adds only the attestation and the upload. It does not run the tests again: before
# packing, it checks that CHANGELOG.md has a section for the version (a pre-release need not),
# which becomes the release's notes, that the tagged commit is on main (a pre-release may come
# from a branch) and that CI passed on that exact commit. What a human confirms before tagging
# (the escape corpus, the nightly stress and fuzz runs, the benchmarks, the threat model) is
# in the release checklist issue template, and docs/releasing.md walks through it.
#
# Publishing waits on the `release` environment, which should require a reviewer. It pushes
# with NuGet trusted publishing: the job exchanges its GitHub OIDC token for an API key that
# lasts an hour, so there is no long-lived key in the repository's secrets to steal.
# ---------------------------------------------------------------------------------------

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  pack:
    name: pack, check and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the next steps can tell whether the tag is on main.
          fetch-depth: 0

      # Until 1.0 every release is 0.y.z (docs/releasing.md says when that changes), so a tag
      # outside that range is a mistake and stops here. Leaving 0.x means editing this check,
      # which is deliberate: it should be a decision, not a typo.
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v0.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release's notes on GitHub are its section of CHANGELOG.md, so a release cannot be
      # tagged before its changes are written down. A pre-release gets GitHub's generated notes
      # instead, and needs no section of its own.
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "$VERSION is a pre-release, so its notes are generated from the pull requests."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/notes"
          build/ci/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes/release-notes.md"
          cat "$RUNNER_TEMP/notes/release-notes.md"

      # docs/releasing.md says to tag a commit on main. A release candidate may be cut from a
      # branch, so a version with a pre-release suffix skips this check but not the next one.
      - name: Check that the tagged commit is on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "$VERSION is a pre-release, so it may be tagged on a branch."
            exit 0
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

      # Packing, attesting and installing prove where a package was built, not that its tests
      # passed. So the release needs a successful CI run on this exact commit. A pull_request
      # run does not count, because it tests the pull request merged into main rather than the
      # commit itself. If the push run was cancelled, or the commit is on a branch, run CI by
      # hand on the tag (Actions > CI > Run workflow, with the tag as the ref). If CI is still
      # running, this fails; re-run the release once it is green.
      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --limit 100 --json event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          if [[ "$runs" == "0" ]]; then
            echo "::error::No successful CI run (push or workflow_dispatch) for $GITHUB_SHA."
            exit 1
          fi
          echo "Found $runs successful CI run(s) for $GITHUB_SHA."

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack and check the contents
        run: build/ci/pack.sh "$RUNNER_TEMP/feed" "${{ steps.version.outputs.version }}"

      - name: Build again from another directory and compare the assemblies
        run: build/ci/check-reproducible.sh "$RUNNER_TEMP/reproducible"

      # The attestation covers each .nupkg as built here, and each assembly inside one. The
      # assemblies matter because nuget.org adds its repository signature to a package on
      # upload, which changes the .nupkg's bytes but not the files in it. So a package
      # downloaded from nuget.org is checked through its assemblies, and one downloaded from
      # the GitHub release can be checked whole.
      - name: Extract the assemblies to attest
        run: |
          for nupkg in "$RUNNER_TEMP"/feed/*.nupkg; do
            unzip -q "$nupkg" '*.dll' -d "$RUNNER_TEMP/assemblies/$(basename "$nupkg" .nupkg)"
          done

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/feed/*.nupkg
            ${{ runner.temp }}/assemblies/**/*.dll

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/feed/*.nupkg

      - uses: actions/upload-artifact@v7
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error

  install:
    name: packages install (${{ matrix.name }})
    needs: pack
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/feed
      - name: Install into fresh consumers, build and run
        shell: bash
        run: >
          build/ci/verify-package-install.sh
          "${{ runner.temp }}/feed" "${{ needs.pack.outputs.version }}" "${{ runner.temp }}/install"

  publish:
    name: publish to nuget.org and GitHub
    needs: [pack, install]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      # This job has no checkout, so it cannot read global.json. The version must equal the
      # one global.json names; the lint job in ci.yml checks that they match.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/feed
      - uses: actions/download-artifact@v8
        if: ${{ !contains(needs.pack.outputs.version, '-') }}
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Exchange the OIDC token for a short-lived nuget.org key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "$RUNNER_TEMP/feed/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            notes=(--generate-notes --prerelease)
          else
            notes=(--notes-file "$RUNNER_TEMP/notes/release-notes.md")
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/feed/*.nupkg \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" "${notes[@]}"
